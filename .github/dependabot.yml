version: 2
updates:
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    # Widen the version constraints instead of raising the lower bound.
    # This library must stay installable on all supported PHP versions.
    versioning-strategy: "widen"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    groups:
      symfony:
        patterns:
          - "symfony/*"
      dev-tools:
        patterns:
          - "friendsofphp/php-cs-fixer"
          - "phpstan/*"
          - "phpunit/phpunit"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
