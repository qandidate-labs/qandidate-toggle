name: "CI"

on:
  workflow_dispatch:
  pull_request:
    branches:
      - "master"
  push:
    branches:
      - "master"
  schedule:
    - cron: "37 13 * * 1"

permissions:
  contents: "read"

concurrency:
  group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
  cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
  tests:
    name: "Run tests (PHP ${{ matrix.php-version }}, ${{ matrix.dependency-versions }} dependencies)"
    runs-on: "ubuntu-latest"
    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependency-versions:
          - "highest"
        include:
          # Test the lowest allowed dependencies only on the lowest supported PHP version.
          # The oldest releases of some dependencies predate newer PHP versions.
          - php-version: "8.2"
            dependency-versions: "lowest"
    services:
      redis:
        image: "redis:7"
        ports:
          - "6379:6379"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
      - name: "Validate composer.json"
        run: "composer validate --strict --no-interaction --ansi"
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependency-versions }}"
      - name: "Run tests"
        run: "make test"

  coding-standards:
    name: "Coding standards"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
      - name: "Check coding standards"
        run: "make php-cs-fixer-ci"

  static-analysis:
    name: "Static analysis"
    runs-on: "ubuntu-latest"
    steps:
      - name: "Checkout"
        uses: "actions/checkout@v7"
      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.5"
          coverage: "none"
      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"
      - name: "Run PHPStan"
        run: "vendor/bin/phpstan analyse --no-progress --error-format=github"
